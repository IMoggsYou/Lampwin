ShortDescription: The macOS look for Windows 11 - the genie effect, squircle window corners, desktop widgets and app icons.
Description: |-
  Lampwin animates windows like macOS: they fall into the taskbar like a genie and fly back
  out, or zoom, shatter and fall apart, and get soft squircle corners. It adds desktop
  widgets (clock, calendar, weather, system, notes, photo, countdown, now playing), lets you
  give programs icons of your own, and has switches to make Windows quieter about your data.
  Free and open source; it collects nothing.
